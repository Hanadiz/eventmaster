<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4CAF50">
    <title>Create Account – EventMaster UG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary: #4CAF50;
            --primary-dark: #388E3C;
            --primary-light: #E8F5E9;
            --danger: #F44336;
            --danger-light: #FFEBEE;
            --warning: #FF9800;
            --bg: #F5F7FA;
            --surface: #FFFFFF;
            --text: #1A1A2E;
            --text-secondary: #6B7280;
            --text-muted: #9CA3AF;
            --border: #E5E7EB;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 20px rgba(0,0,0,0.1);
            --shadow-lg: 0 10px 40px rgba(0,0,0,0.15);
            --radius-sm: 8px;
            --radius: 12px;
            --radius-lg: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
        }
        
        .auth-container { display: flex; width: 100%; min-height: 100vh; }
        
        .auth-branding {
            flex: 1;
            background: linear-gradient(135deg, #1A1A2E, #16213E, #0F3460);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem;
            position: relative;
            overflow: hidden;
        }
        
        .auth-branding::before {
            content: '';
            position: absolute;
            bottom: -20%;
            left: -10%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(76,175,80,0.12), transparent);
            border-radius: 50%;
        }
        
        .branding-content {
            position: relative;
            z-index: 1;
            max-width: 450px;
        }
        
        .branding-content h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
        }
        
        .branding-content > p {
            color: rgba(255,255,255,0.7);
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }
        
        .brand-features {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        
        .brand-feature {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.95rem;
            color: rgba(255,255,255,0.8);
        }
        
        .feature-icon {
            width: 36px;
            height: 36px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .auth-form-panel {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: var(--bg);
        }
        
        .form-wrapper {
            width: 100%;
            max-width: 480px;
        }
        
        .form-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .form-header .logo-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            color: var(--text);
            font-weight: 700;
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
        }
        
        .form-header h2 { font-size: 1.8rem; margin-bottom: 0.5rem; }
        .form-header p { color: var(--text-secondary); }
        .form-header a { color: var(--primary); text-decoration: none; font-weight: 600; }
        
        /* Progress Steps */
        .progress-steps {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0;
            margin-bottom: 2rem;
        }
        
        .step {
            width: 32px; height: 32px;
            border-radius: 50%;
            background: #e0e0e0;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.85rem;
            transition: var(--transition);
        }
        
        .step.active { background: var(--primary); }
        .step.completed { background: var(--primary); }
        
        .step-line {
            width: 50px; height: 2px;
            background: #e0e0e0;
            transition: var(--transition);
        }
        
        .step-line.completed { background: var(--primary); }
        
        .step-content { display: none; }
        .step-content.active { display: block; }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        
        .form-group { margin-bottom: 1.1rem; }
        
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 0.35rem;
        }
        
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.7rem 0.85rem;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            font-family: inherit;
            transition: var(--transition);
            background: white;
        }
        
        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(76,175,80,0.1);
        }
        
        .phone-input {
            display: flex;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            overflow: hidden;
            transition: var(--transition);
            background: white;
        }
        
        .phone-input:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(76,175,80,0.1);
        }
        
        .phone-prefix {
            padding: 0.7rem 0.5rem 0.7rem 0.85rem;
            background: #f9f9f9;
            font-weight: 600;
            color: var(--text-secondary);
            border-right: 1px solid var(--border);
            font-size: 0.9rem;
        }
        
        .phone-input input {
            border: none !important;
            border-radius: 0 !important;
            box-shadow: none !important;
        }
        
        /* Account Type */
        .account-types {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }
        
        .account-type-card {
            padding: 1rem;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
        }
        
        .account-type-card:hover { border-color: var(--primary); }
        
        .account-type-card.selected {
            border-color: var(--primary);
            background: var(--primary-light);
        }
        
        .account-type-card input { display: none; }
        
        .type-icon { font-size: 1.8rem; display: block; margin-bottom: 0.5rem; }
        
        .type-name { font-weight: 600; font-size: 0.9rem; }
        
        .type-desc { font-size: 0.75rem; color: var(--text-secondary); }
        
        /* Password Strength */
        .password-strength { margin-top: 0.5rem; }
        
        .strength-bar {
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 0.25rem;
        }
        
        .strength-fill {
            height: 100%;
            width: 0;
            border-radius: 2px;
            transition: all 0.3s;
        }
        
        .strength-text { font-size: 0.75rem; color: var(--text-muted); }
        
        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: var(--radius-sm);
            font-weight: 600;
            cursor: pointer;
            border: none;
            font-size: 0.95rem;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-family: inherit;
        }
        
        .btn-primary {
            background: var(--primary);
            color: white;
            width: 100%;
            box-shadow: 0 4px 15px rgba(76,175,80,0.3);
        }
        
        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(76,175,80,0.4);
        }
        
        .btn-outline {
            background: transparent;
            border: 2px solid var(--border);
            color: var(--text);
        }
        
        .btn-outline:hover { border-color: var(--primary); color: var(--primary); }
        
        .form-buttons { display: flex; gap: 0.75rem; margin-top: 1rem; }
        .form-buttons .btn { flex: 1; }
        
        .checkbox-label {
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
            font-size: 0.85rem;
            cursor: pointer;
        }
        
        .checkbox-label input {
            width: 16px; height: 16px;
            accent-color: var(--primary);
            margin-top: 2px;
        }
        
        .error-message {
            background: var(--danger-light);
            color: #c62828;
            padding: 0.75rem 1rem;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            border-left: 3px solid var(--danger);
            display: none;
            margin-top: 0.75rem;
        }
        
        .error-message.show { display: block; }
        
        @media (max-width: 900px) {
            .auth-branding { display: none; }
            .form-row { grid-template-columns: 1fr; }
            .account-types { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-branding">
            <div class="branding-content">
                <h1>Join EventMaster UG</h1>
                <p>Create your account and start managing events or buying tickets across Uganda.</p>
                <div class="brand-features">
                    <div class="brand-feature">
                        <span class="feature-icon">🎫</span>
                        <span>Buy & sell event tickets</span>
                    </div>
                    <div class="brand-feature">
                        <span class="feature-icon">📱</span>
                        <span>Mobile money payments</span>
                    </div>
                    <div class="brand-feature">
                        <span class="feature-icon">💬</span>
                        <span>WhatsApp ticket delivery</span>
                    </div>
                    <div class="brand-feature">
                        <span class="feature-icon">🇺🇬</span>
                        <span>Made for Uganda</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="auth-form-panel">
            <div class="form-wrapper">
                <div class="form-header">
                    <a href="../public/index.html" class="logo-link">🎫 EventMaster UG</a>
                    <h2>Create Account</h2>
                    <p>Already have an account? <a href="login.html">Sign in</a></p>
                </div>
                
                <div class="progress-steps">
                    <div class="step active" id="step1Indicator">1</div>
                    <div class="step-line" id="lineIndicator"></div>
                    <div class="step" id="step2Indicator">2</div>
                </div>
                
                <form id="registerForm">
                    <!-- Step 1 -->
                    <div class="step-content active" id="step1Content">
                        <div class="form-row">
                            <div class="form-group">
                                <label>First Name *</label>
                                <input type="text" id="firstName" placeholder="Prossy" required>
                            </div>
                            <div class="form-group">
                                <label>Last Name *</label>
                                <input type="text" id="lastName" placeholder="Nakamya" required>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label>Email Address *</label>
                            <input type="email" id="regEmail" placeholder="you@example.com" required>
                        </div>
                        
                        <div class="form-group">
                            <label>Phone Number *</label>
                            <div class="phone-input">
                                <span class="phone-prefix">+256</span>
                                <input type="tel" id="regPhone" placeholder="7XX XXX XXX" maxlength="9" required>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label>Password *</label>
                            <input type="password" id="regPassword" placeholder="Min 8 characters" minlength="8" required>
                            <div class="password-strength">
                                <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
                                <span class="strength-text" id="strengthText">Password strength</span>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label>Confirm Password *</label>
                            <input type="password" id="confirmPassword" placeholder="Re-enter password" required>
                        </div>
                        
                        <button type="button" class="btn btn-primary" id="nextStepBtn">
                            Continue → Next Step
                        </button>
                    </div>
                    
                    <!-- Step 2 -->
                    <div class="step-content" id="step2Content">
                        <div class="form-group">
                            <label>Account Type</label>
                            <div class="account-types">
                                <label class="account-type-card selected" id="customerType">
                                    <input type="radio" name="accountType" value="customer" checked>
                                    <span class="type-icon">🎫</span>
                                    <span class="type-name">Ticket Buyer</span>
                                    <span class="type-desc">Buy tickets for events</span>
                                </label>
                                <label class="account-type-card" id="organizerType">
                                    <input type="radio" name="accountType" value="organizer">
                                    <span class="type-icon">📅</span>
                                    <span class="type-name">Event Organizer</span>
                                    <span class="type-desc">Create and manage events</span>
                                </label>
                            </div>
                        </div>
                        
                        <div class="form-group" id="orgNameGroup" style="display:none;">
                            <label>Organization Name</label>
                            <input type="text" id="organization" placeholder="Your company or brand">
                        </div>
                        
                        <div class="form-group">
                            <label>City</label>
                            <select id="city">
                                <option value="">Select your city</option>
                                <option value="Kampala">Kampala</option>
                                <option value="Entebbe">Entebbe</option>
                                <option value="Jinja">Jinja</option>
                                <option value="Mbarara">Mbarara</option>
                                <option value="Gulu">Gulu</option>
                                <option value="Mbale">Mbale</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label class="checkbox-label">
                                <input type="checkbox" id="agreeTerms" required>
                                <span>I agree to the <a href="../public/terms.html">Terms of Service</a> and <a href="../public/privacy.html">Privacy Policy</a></span>
                            </label>
                        </div>
                        
                        <div class="form-buttons">
                            <button type="button" class="btn btn-outline" id="prevStepBtn">← Back</button>
                            <button type="submit" class="btn btn-primary" id="registerBtn">
                                Create Account
                            </button>
                        </div>
                    </div>
                    
                    <div class="error-message" id="registerError"></div>
                </form>
            </div>
        </div>
    </div>

    <script>
        let currentStep = 1;
        const totalSteps = 2;
        
        // Step navigation
        document.getElementById('nextStepBtn').addEventListener('click', () => {
            if (validateStep1()) {
                currentStep = 2;
                updateSteps();
            }
        });
        
        document.getElementById('prevStepBtn').addEventListener('click', () => {
            currentStep = 1;
            updateSteps();
        });
        
        function updateSteps() {
            document.getElementById('step1Indicator').className = `step ${currentStep > 1 ? 'completed' : 'active'}`;
            document.getElementById('step2Indicator').className = `step ${currentStep === 2 ? 'active' : ''}`;
            document.getElementById('lineIndicator').className = `step-line ${currentStep > 1 ? 'completed' : ''}`;
            
            document.getElementById('step1Content').classList.toggle('active', currentStep === 1);
            document.getElementById('step2Content').classList.toggle('active', currentStep === 2);
        }
        
        function validateStep1() {
            const fields = ['firstName', 'lastName', 'regEmail', 'regPhone', 'regPassword', 'confirmPassword'];
            let valid = true;
            
            fields.forEach(id => {
                const el = document.getElementById(id);
                if (!el.value.trim()) {
                    el.style.borderColor = '#F44336';
                    valid = false;
                } else {
                    el.style.borderColor = '#E5E7EB';
                }
            });
            
            if (document.getElementById('regPassword').value !== document.getElementById('confirmPassword').value) {
                showError('Passwords do not match');
                return false;
            }
            
            if (document.getElementById('regPassword').value.length < 8) {
                showError('Password must be at least 8 characters');
                return false;
            }
            
            if (!valid) showError('Please fill in all required fields');
            return valid;
        }
        
        // Account type toggle
        document.querySelectorAll('.account-type-card').forEach(card => {
            card.addEventListener('click', function() {
                document.querySelectorAll('.account-type-card').forEach(c => c.classList.remove('selected'));
                this.classList.add('selected');
                this.querySelector('input').checked = true;
                
                const isOrganizer = this.querySelector('input').value === 'organizer';
                document.getElementById('orgNameGroup').style.display = isOrganizer ? 'block' : 'none';
            });
        });
        
        // Password strength
        document.getElementById('regPassword').addEventListener('input', function() {
            const val = this.value;
            let score = 0;
            if (val.length >= 8) score++;
            if (/[A-Z]/.test(val)) score++;
            if (/[0-9]/.test(val)) score++;
            if (/[^A-Za-z0-9]/.test(val)) score++;
            
            const percentages = [15, 35, 60, 85];
            const colors = ['#F44336', '#FF9800', '#2196F3', '#4CAF50'];
            const labels = ['Weak', 'Fair', 'Good', 'Strong'];
            
            const fill = document.getElementById('strengthFill');
            fill.style.width = `${percentages[score] || 0}%`;
            fill.style.background = colors[score] || '#e0e0e0';
            document.getElementById('strengthText').textContent = `Password strength: ${labels[score] || 'Weak'}`;
        });
        
        // Form submission
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            if (!validateStep1()) return;
            if (!document.getElementById('agreeTerms').checked) {
                showError('Please agree to the Terms of Service');
                return;
            }
            
            const btn = document.getElementById('registerBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating Account...';
            
            await new Promise(resolve => setTimeout(resolve, 1500));
            
            const userData = {
                name: `${document.getElementById('firstName').value} ${document.getElementById('lastName').value}`,
                email: document.getElementById('regEmail').value,
                role: document.querySelector('[name="accountType"]:checked').value,
                loggedIn: true,
            };
            
            sessionStorage.setItem('eventmaster_user', JSON.stringify(userData));
            
            const redirect = userData.role === 'organizer' 
                ? '../dashboard/manager/index.html' 
                : '../dashboard/customer/index.html';
            
            window.location.href = redirect;
        });
        
        function showError(message) {
            const el = document.getElementById('registerError');
            el.textContent = message;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 5000);
        }
    </script>
</body>
</html>
